<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peloton Instructors</title>
    <!-- Premium fonts: 'Outfit' for UI text, 'Permanent Marker' for polaroid captions -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&family=Permanent+Marker&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header>
        <h1>Meet the Instructors</h1>
        <p class="subtitle">The dynamic personalities driving the Peloton community.</p>
        <div class="controls-container">
            <input type="text" id="instructor-filter" class="instructor-filter" placeholder="Filter by name...">
            <div class="instructor-count">Showing <span id="count-number">0</span> instructors</div>
        </div>
    </header>

    <div id="loader" class="loader">
        <div class="loader-spinner"></div>
        <p>Loading the team...</p>
    </div>

    <div id="error" class="error" style="display: none;"></div>

    <main id="gallery" class="gallery" style="display: none;"></main>

    <script src="data.js"></script>
    <script src="script.js"></script>
</body>
</html>
